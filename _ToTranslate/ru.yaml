"Prem:Title": "Премиум аккаунт"
"Prem:MainScreen/Description": "Владельцам премиум аккаунта доступен бонус к опыту и кредитам за каждый бой, редкий камуфляж «Бесспорное преимущество», а также несколько эксклюзивных функций, которые сделают твою игру комфортнее и эффективнее."
"Prem:ArmorViewer/Title": "Бронирование танков"
"Prem:MainScreen/Cards/ArmorViewer/Text": "Изучай бронирование танков и узнай их слабые и сильные стороны в режиме дуэли"
