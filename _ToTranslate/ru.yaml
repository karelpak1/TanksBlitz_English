"Prem:SessionStatistics/Title": "Сессионная статистика"
"Prem:MainScreen/Cards/SessionStatistics/Text": "Следи за показателями своей боевой эффективности и сохраняй лучшие сессии"
"Prem:MainScreen/Cards/MapBan/NotEnableCard": "Исследуй танк V уровня или сыграй 60 боёв"
"Prem:Label": "Премиум функция"
"Prem:Modals/ArmorViewer/Title": "Бронирование танков"
"Prem:Modals/ArmorViewer/Description": "Рассматривай модели танков с любого ракурса и находи уязвимые места даже у самых сильных противников."
"Prem:BenefitsLabel": "Особенности:"
"Prem:Modals/ArmorViewer/RichText": "<check_mark/> Изучай базовое и приведённое бронирование техники.<br/><br/><check_mark/> Просматривай расположение модулей и членов экипажа.<br/><br/><check_mark/> Проверяй броню техники в режиме дуэли.<br/><br/><check_mark/> Настраивай модули атакующего танка и мишени."
"Prem:Modals/SessionStatistics/Title": "Сессионная статистика"
"Prem:Modals/SessionStatistics/Description": "Узнай свою боевую эффективность за игровую сессию — выбранную тобой серию обычных или рейтинговых боёв."
"Prem:Modals/SessionStatistics/RichText": "<check_mark/> Самостоятельно определяй длительность сессии.<br/><br/><check_mark/> Настраивай отображаемые в виджете показатели под себя.<br/><br/><check_mark/> Смотри подробную статистику на отдельном экране.<br/><br/><check_mark/> Добавляй свои лучшие сессии в «Избранные»."
"Prem:Modals/NotificationPrem/Title": "Получен премиум аккаунт"
"Prem:Modals/NotificationPrem/Description": "Тебе начислен премиум аккаунт на %(time)%(timePeriod).\nПользуйся его преимуществами, чтобы сделать свою игру комфортнее и эффективнее"
"Prem:Modals/NotificationPrem/RichText": "<check_mark/> +50% к опыту и кредитам за каждый бой<br/><br/><check_mark/> Редкий камуфляж «Бесспорное преимущество»<br/><br/><check_mark/> Просмотр бронирования танков<br/><br/><check_mark/> Возможность исключить нелюбимую карту<br/><br/><check_mark/> Доступ к сессионной статистике"
"Prem:Modals/PremExpiried/Title": "Премиум аккаунт истёк"
"Prem:Modals/PremExpiried/Description": "Бонусы и эксклюзивные функции больше не доступны.\nПродли премиум аккаунт, чтобы снова пользоваться его преимуществами"
"Prem:Modals/PremExpiried/Benefits": "Преимущества:"
