"MapBan/InfoModal/Subtitle": "Как это работает:"
"MapBan/InfoModal/Text": "• Нажми на кнопку с перечёркнутым кругом под картой, чтобы исключить её из ротации или вернуть обратно. Изменять выбор можно раз в %(time).<br/><br/>• Карта исключается во всех игровых режимах, кроме турнирных боёв.<br/><br/>• Во взводе исключает карту только командир с премиумом. Если у командира нет премиума, то исключается карта от совзводного с премиумом. <br/><br/>• Если премиум истёк, а затем был продлён, то ранее исключённая карта автоматически убирается из ротации."
