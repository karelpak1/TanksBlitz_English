"battleType/fest_gladiatorskiy/title": "Зимние вышибалы"
"battleType/fest_gladiatorskiy/description": "Врывайся в снежное веселье и выжми максимум из Призового фонда!\n\nОсобенности:\n• Всего 12 игроков. Твоя цель — остаться единственным выжившим.\n• Бои проходят на танках одинакового уровня только на Арене чудес и не учитываются в статистике.\n• Игровая зона постепенно уменьшается.\n• Из жёлтой зоны нужно выехать в течение 60 секунд, иначе она станет красной и начнёт наносить танку постоянный урон.\n• Наноси урон, уничтожай танки, собирай бонусы и преодолевай уменьшение зоны, чтобы прокачать танк до 10 уровня. Выбирай одно из двух усилений со старта и при повышении уровня.\n• Собирай бонусы, чтобы зарядить Регенерацию — она восстанавливает прочность танка.\n• Бонусы обозначены разноцветными лучами на карте.\n• <blue_text>Снабжение</blue_text> повышает мастерство экипажа и запас прочности, быстрее заряжает Регенерацию и прокачивает уровень танка.\n• Припасы есть двух видов: <green_text>один</green_text> повышает живучесть танка, <yellow_text>другой</yellow_text> — мастерство экипажа. В них же, вместе с усилением характеристик, тебя ждёт случайный сюрприз.\n• <red_text>Трофеи</red_text> увеличивают разовый урон и мгновенно перезаряжают орудие.\n• В игре есть Призовой фонд, который на старте боя составляет 2027 Заводных ключиков.\n• Призовой фонд увеличивается, когда кто-то из игроков добывает такой сюрприз, выбирает нужное усиление или выбывает из игры.\n• Призовой фонд уменьшается каждые 5 секунд боя, а ещё при захвате бонусов и выборе соответствующего усиления.\n• Уничтожай противников и собирай бонусы, чтобы забирать Заводные ключики из фонда лично себе: они понадобятся для запуска Волшебных курантов в событии «Огни замка».\n• После боя ты получишь заработанные ключики, а оставшийся Призовой фонд поделится между игроками, занявшими призовые места (1 место — 35%, 2 место — 25%, 3 место — 16%, 4–6 места — по 8%)."
