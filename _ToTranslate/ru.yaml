"Maps/Description/lumber": "Тихий альпийский городок был идеальным укрытием для шпионов. Но тайное стало явным, и теперь на узких улочках готовятся танковые баталии."
"Maps/Tactics/lumber": "Карта разделена рекой. Тяжам комфортнее играть от брони в городе, а манёвренной технике — на холмистом берегу. Мосты экономят время, но хорошо обстреливаются ПТ. Путь через русло реки занимает больше времени, зато помогает застать противника врасплох."
"Maps/Description/karelia": "Суровый северный край, где гигантские валуны стали естественным щитом для бронетехники. Внутри каменного лабиринта скрыт штаб."
"Maps/Tactics/karelia": "Тяжёлым танкам выгодно контролировать зону с бункерами у ворот ангара, а более манёвренным — играть от рельефа и УВН на холмистом плато. Ближе к центру особенно опасны прострелы от дальнобойной техники с краёв карты."
"Maps/Description/italy": "Живописный городок отделён от заброшенных окраин зелёными холмами. Теперь среди виноградников пролегают пути наступления."
"Maps/Tactics/italy": "Дороги в городе дают ТТ двигаться быстрее, а здания при этом прикрывают борта. Но все пути из города опасно простреливаются ПТ из центра карты. В ответ быстрые танки могут попытаться развить атаку через руины: оттуда удобно совершить бросок в центр через реку."
"Maps/Description/milbase": "Военный порт в тени ожившего вулкана. Здесь ждёт своего часа легендарный линкор «Ямато», готовый пробудиться вслед за горой."
"Maps/Tactics/milbase": "Корабль и холмы — взаимно простреливаемые высоты. На судне манёвр ограничен, поэтому удобнее играть от брони. Холмы же дают укрытие и позволяют наносить внезапные удары. А ещё за ними есть места, откуда можно работать по союзному засвету."
"Maps/Description/savanna": "В сердце пустыни раскалённые пески окружили посёлок. Как в восточных сказках, могучие барханы скрывают здесь внезапные засады."
"Maps/Tactics/savanna": "СТ с хорошими УВН могут вести огонь по городу с барханов за высохшей рекой, но рискуют сами стать целью. ЛТ имеют шанс прорваться через скалы в тыл врага. ТТ с крепкой башней выгодно занять барханы у города — крутые склоны укроют борта."
"Maps/Description/rock": "В знойных тропиках сохранились руины величественной цивилизации. Бьющие до сих пор фонтаны остаются воплощением забытых технологий древних."
"Maps/Tactics/rock": "Пирамиды — место для тяжёлых танков или игры от бортов. Холмы и река дают простор для мобильной техники. А захват высоты в центре может обеспечить контроль над всей локацией."
"Maps/Description/grossberg": "Процветающий восточный городок, в котором гармонично сосуществует суетливый деловой центр с безмятежным парком."
"Maps/Tactics/grossberg": "Городская застройка больше располагает к позиционным перестрелкам из-за укрытий и аккуратному использованию брони. Парковая зона, напротив, даёт больше возможностей для фланговых манёвров и контроля проездов с холмов."
"Maps/Description/malinovka": "Небольшая деревня на берегу глубокого озера. Зимой воду сковал лёд, а тихие дома превратились в укрытия на поле боя."
"Maps/Tactics/malinovka": "Бои на холмистом поле больше располагают к динамике и быстрым решениям, тогда как у мельницы выгоднее полагаться на крепкую броню. Оба эти направления открыты для взаимных прострелов."
"Maps/Description/mountain": "В надежде на удачу эту долину прозвали Золотой, но самородки тут не нашлись. Зато край оказался сказочно богат чёрным золотом."
"Maps/Tactics/mountain": "Мобильная техника может обойти противника через пещеру или занять выгодные позиции для игры от башни. Захват промзоны больше подходит для игры от брони и ДПМ. При выборе направления стоит учитывать, что открытые участки здесь хорошо простреливаются."
"Maps/Description/canal": "Стройка канала на севере замерла, оставив завод и посёлок в кольце полузатопленных траншей. Но жизнь упряма: здесь даже разводят пчёл."
"Maps/Tactics/canal": "Пригорки у железной дороги располагают к снайперской стрельбе или манёврам. На другом берегу, напротив, важнее умение играть от брони. Проезд вдоль канала помогает сменить направление, но мягкий грунт снижает скорость движения."
"Maps/Description/canyon": "Снег тает, открывая пути к рудникам и сонному городку. Поезд с тайным грузом разграблен у моста, как во времена Дикого Запада."
"Maps/Tactics/canyon": "Оба фланга имеют районы с плотной застройкой для позиционных боёв. Манёвренная техника может попытаться обойти противника по руслу реки. А с хорошими УВН есть смысл занять центральный холм: там удобно играть от башни и прикрывать союзников."
"Maps/Description/karieri": "Воздух в карьере пропитан пылью, но привычный грохот от взрывных работ и дробления руды смолк. Теперь между плавильными цехами и ангарами гремят совсем другие взрывы."
"Maps/Tactics/karieri": "Спускаться в низину стоит лишь убедившись, что хотя бы один из флангов зачищен, иначе есть риск оказаться под перекрёстным огнём. Если ситуация накаляется, можно попробовать найти укрытие в ангарах."
"Maps/Description/pliego": "В сердце испанских земель, на высоком холме, стоит монастырь. Река отделяет его от города, делая обитель похожей на крепость."
"Maps/Tactics/pliego": "Рельеф у мельницы подходит для удержания позиций ТТ. Быстрые машины могут атаковать через город, но между домами есть риск пропустить снаряд в борт. Монастырь даёт широкий обзор, однако требует осторожности: есть риск стать мишенью самому."
"Maps/Description/lagoon": "Экспедиция в Юго-Восточную Азию. На вершине горы идут раскопки древнего храма, возвышающегося над деревушкой и скалистым берегом."
"Maps/Tactics/lagoon": "Храмовый район подходит для тяжёлой техники: ровный рельеф и много укрытий. На берегу же имеют преимущество манёвренные машины с крепкой башней или хорошими УВН. Центр идеален для засвета противников и контроля ключевых переездов, включая пляжную зону."
"Maps/Description/glacier": "В тихом городке среди вечной мерзлоты скрыта мощь великанов. Разбитые суда на скалах тому свидетели."
"Maps/Tactics/glacier": "Маяк в центре даёт широкий обзор, но особенно опасен во время подъёма. На берегу с постройками преимущество есть у манёвренных и дальнобойных танков. Лёд у кораблей подходит для техники с крепкой бронёй и хорошими УВН, позволяя играть от рельефа."
"Maps/Description/erlenberg": "Покой курортного европейского городка сменили боевые приготовления. Даже руинам замка придётся вспомнить, что такое буря и натиск."
"Maps/Tactics/erlenberg": "В городе доминирует техника с мощной бронёй и высокой огневой мощью, но открытые переулки уязвимы для огня с горы. Гора, в свою очередь, даёт мобильным машинам отличную возможность для манёвров, фланговых обходов и контроля городских проездов."
"Maps/Description/holland": "Живописный городок обрёл мрачную музу. Идиллию старых мельниц и цветочных полей нарушают грохот боёв и пылающий в небе дирижабль."
"Maps/Tactics/holland": "Манёвренным танкам выгоднее первыми занять холмистую деревню: там можно устроить засаду у бункера. Город больше подходит для тяжёлой техники. Выезд из города к центру и участок с мельницами раскрывают потенциал машин с крепкой башней и хорошими УВН."
"Maps/Description/skit": "У скал Северного моря руины древнего замка соседствуют с массивными бетонными укреплениями. Теперь это единый и грозный морской рубеж."
"Maps/Tactics/skit": "ЛТ и СТ выгодно первыми занять береговые укрепления ради дальнобойных, но открытых огневых позиций. ТТ комфортней в позиционной игре у руин и скал, хотя нужно остерегаться обхода с тыла. ПТ найдут укрытия у замка, но пути туда могут быть опасны."
"Maps/Description/neptune": "На севере Франции идёт захват плацдарма. Крупнейшая высадка в истории разворачивается под вспышки канонады и гул воздушных боёв."
"Maps/Tactics/neptune": "У мельницы комфортно играть от башни в самой гуще боёв. У самолёта легко затаиться, но можно не заметить вражеский обход. Берег — рискованный путь в тыл под огнём сверху. А поле с зенитками полно безопасных укрытий, но отдаляет от основного боя."
"Maps/Description/forgecity": "Небоскрёбы, старые доки, китайский квартал и гигантский пончик. Амбициозный мегаполис хранит тысячи историй, но сейчас ему нужны герои."
"Maps/Tactics/forgecity": "Карта контрастов: городские кварталы с узкими проездами подходят для игры от брони, а длинная набережная под мостом удобна для быстрых фланговых манёвров. Возвышающийся мост служит ключевой позицией для контроля центральных улиц."
"Maps/Description/port": "У подножия холмов дремлет порт с маяком. Кирпичные улочки ведут к старой ратуше, напоминающей о том, как незаметно здесь бежит время."
"Maps/Tactics/port": "Скалы делят карту надвое. ЛТ могут встать за рекой, а СТ и ПТ — закрепиться на холмах для обороны или поддержки ТТ с выступов, хоть прострелы по городу и ограничены. ТТ удобно атаковать через порт, где наряду с прочными зданиями есть много разрушаемых укрытий."
"Maps/Description/plant": "Смена на крупном заводе прервана. Среди угольных насыпей и ангаров идут бои. Между товарной станцией и рухнувшим мостом застыли поезда."
"Maps/Tactics/plant": "Завод даёт укрытие ТТ, а своевременное уничтожение ворот помогает оценить силы врага. Быстрым СТ проще занять мост, получив обзор большинства подъездов к заводу. ПТ комфортнее работать по засвету союзников у реки или разбитого поезда, а также на насыпях угля."
"Maps/Description/amigosville": "Уютный промышленный посёлок у подножия заснеженных гор. Каждую весну талые воды стекают с вершин в лощину."
"Maps/Tactics/amigosville": "СТ удобно пересекать холмы у фабрики, нанося фланговые удары. ТТ сражаются у моста, где выгодно играть от башни и УВН. Контроль моста даёт ПТ прострел почти всей карты. Центр опасен, но благодаря союзному засвету открывает отличные возможности для стрельбы."
"Maps/Description/rudniki": "Средиземноморский городок охвачен боями. Рудник на возвышенности открывает вид на улицы, военную часть и побережье с островками и маяком."
"Maps/Tactics/rudniki": "Быстрым танкам с хорошими УВН выгодно занять рудник, хоть вершину и простреливают ПТ прямо с баз. Чтобы выбить ПТ, манёвренная техника может обойти её через маяк или заводь. ТТ комфортно играть от укрытий в безопасном от прострелов городе."
"Maps/Description/faust": "Секретный военный полигон глубоко в горах. Вдали от чужих глаз здесь разрабатывают и испытывают экспериментальные баллистические ракеты."
"Maps/Tactics/faust": "СТ выгодно занять бункер ради возможности быстрого проезда к оборонительным платформам в центре. При поддержке союзников эти платформы — удобные позиции для ПТ. Тяжам комфортнее сражаться у здания B-52, откуда с высоты отлично простреливается центр."
"Maps/Description/fort": "В горах высится заброшенный форт. Его стены всё ещё готовы укрыть бойцов от снарядов, а уцелевшие гобелены — вдохновить на подвиг."
"Maps/Tactics/fort": "Эта компактная карта полна укрытий и перепадов высот. Множество обходных путей требует острой реакции. Манёвренным машинам комфортнее играть ближе к полю, а тяжёлой технике выгоднее занять руины, где разрушенные здания можно использоваться как бойницы."
"Maps/Description/himmelsdorf": "Город после тяжёлых боёв. Пути к центральной площади завалены руинами домов, разбитыми вагонами и обломками замка."
"Maps/Tactics/himmelsdorf": "Быстрые танки могут удачно маневрировать у ж/д или выждать момент и устроить прорыв через центральную площадь. ТТ и машинам с хорошими УВН выгодно вести бои у крепостной стены или в амбразурах центральных руин."
"Maps/Description/rift": "Развалины античного города у лазурного моря, напоминающие о величии Эллады. Амфитеатр теперь готовит новую, поистине эпическую постановку."
"Maps/Tactics/rift": "ТТ удобнее вести бои в руинах у храма: низина даёт прикрытие с флангов, а верхний ярус — укрытия для игры от башни. СТ выгодно агрессивно светить холмы, чтобы выбить ПТ противника, но занимать позиции в одиночку там опасно."
"Maps/Description/desert_train": "Затерянный в пустыне городок, ставший важным узлом снабжения. От песков его рыночные улочки и дома прикрывает железная дорога."
"Maps/Tactics/desert_train": "ТТ удобно вести перестрелку на городской площади или наступать вдоль узких улиц. Мобильным танкам выгоднее на барханах, там же корпус самолёта помогает играть от башни. ПТ могут занять позиции вдоль ж/д, но стоит опасаться прострелов под вагонами."
"Maps/Description/medvedkovo": "В заснеженных горах начался штурм секретной базы. Среди скалистых холмов и ледяных полей идёт борьба за удержание ж/д станции с эшелонами."
"Maps/Tactics/medvedkovo": "Быстрой технике проще укрываться от обстрелов и заходить в тыл через холмы. В открытом поле ТТ сражаются эффективней, опираясь на союзную разведку. Ж/д делит карту пополам, помогая сократить дистанцию и навязать ближний бой, если ПТ контролируют края карты."
"Maps/Description/idle": "Дикий север, затихший после суеты золотой лихорадки. Теперь здесь лишь мерный гул лесопилки, шум горного ручья и цветы в талом снегу."
"Maps/Tactics/idle": "СТ с хорошими УВН удобно занять позицию у водопада, но стоит остерегаться ПТ, контролирующих долину. Крепким ТТ комфортнее вести ближний бой в центре лесопилки при поддержке союзников с флангов."
"Maps/Description/mars": "Среди марсианских пустошей высится авангардный город учёных. Смелым идеям место в Парке Экстремальных Передовых Технологий!"
"Maps/Tactics/mars": "Карта разделена на пустыню и базу под куполом. На окраинах много естественных укрытий и перепадов высот, а стекло купола маскирует подсветку брони. Прорыв внутрь базы может обернуться окружением, но есть шанс ударить противнику в тыл."
"Maps/Description/cybermap": "Рёв моторов сотрясает трибуны. Крутые трамплины и оборудованная арена готовы принять технику для впечатляющих боёв. Это — Стадион!"
"Maps/Tactics/cybermap": "ТТ и крепким ПТ удобнее внутри арены: укрытий много, но есть и обходы. Центр же даёт быстро сменить направление, но простреливается с высот. На холмах есть трамплины, которые манёвренные машины могут использовать для прыжков, а остальные — как огневые точки."
