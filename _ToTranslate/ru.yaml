"sessionStatistic/InfoModal/Description": "• Нажми «Начать сессию», чтобы отслеживать свою боевую эффективность в обычных и рейтинговых боях. Сессию можно в любой момент поставить на паузу и продолжить в удобное время. Самостоятельно определяй длительность сессии и нажимай «Завершить сессию», чтобы сохранить статистику.<br/><br/>• Статистика учитывает результаты всех танков, на которых ты играл в текущей сессии, и не зависит от общей статистики в профиле.<br/><br/>• В виджете отображаются показатели в динамике по всем боям за сессию. Ещё больше параметров ищи на экране подробной статистики.<br/><br/>• Сессия автоматически завершается и сохраняется при истечении премиум аккаунта."
