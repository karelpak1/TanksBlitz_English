"storage/Items/chest_b_p_4/Title": "Контейнер «Фан-база»"
"storage/Items/chest_b_p_4/Description": "Содержит до 4 наград из списка, среди которых могут оказаться Талисман контейнера «Вообще огонь», Поинты, танк, камуфляж и многое другое"
"storage/Items/ch_g1_chest/Description": "Гарантированно содержит:\n• сертификаты на свободный опыт и бонус опыта;\n• бустеры кредитов или опыта;\n• коллекционнyю ПТ-САУ X уровня StuG Maus или части сертификатов на танки из списка.<br/><br/>Также может содержать:\n• бустеры золота с вероятностью 75%;\n• золото с вероятностью 20%;\n• дни премиум аккаунта с вероятностью 10%;\n• легендарный камуфляж «Котана» для StuG Maus с вероятностью 5%;\n• анимированный фон профиля «Дух тигра» с вероятностью 5%;\n• Танкоин с вероятностью 0,01%."
"storage/Items/ch_g1_chest/Title": "Контейнер «Оскал хищника»"
"storage/Items/ch_g2_chest/Description": "Гарантированно содержит:\n• сертификаты на свободный опыт и бонус опыта;\n• бустеры кредитов или опыта.<br/><br/>Также может содержать:\n• бустеры золота с вероятностью 60%;\n• золото с вероятностью 50%;\n• анимированный фон профиля «Верховные львы» с вероятностью 4%;\n• тяжёлый премиум танк VIII уровня Löwe в легендарных камуфляжах «Надёжное прикрытие» или «Колосс» с вероятностью 2% каждый;\n• Танкоин с вероятностью 0,01%."
"storage/Items/ch_g2_chest/Title": "Контейнер «Сила льва»"
"storage/Items/ch_g3_chest/Description": "Гарантированно содержит:\n• сертификат на свободный опыт;\n• бустеры кредитов или опыта.<br/><br/>Также может содержать:\n• сертификат на бонус опыта с вероятностью 80%;\n• бустеры золота и перезарядки снаряжения с вероятностью 75%;\n• части сертификатов на танки из списка с вероятностью 65%;\n• золото с вероятностью 35%;\n• фон профиля «Призраки джунглей» с вероятностью 4%;\n• танки Panther/M10, Panther 8,8 или Aufkl. Panther с вероятностью 2% каждый;\n• Танкоин с вероятностью 0,01%."
"storage/Items/ch_g3_chest/Title": "Контейнер «Грация кошки»"
