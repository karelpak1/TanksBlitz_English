"#achievements:medalAlpha_condition": "• Survive at the moment the enemy tank is destroyed\n• Awarded regardless of victory\n• Only one award is granted per battle across both teams"
"#achievements:medalOmega": "Cobra Strike"
"#achievements:medalOmega_descr": "Destroy the last enemy tank in battle"
"#achievements:medalOmega_descr_short": "Destroyed the last enemy tank in battle"
"#achievements:medalOmega_condition": "• Survive at the moment the enemy tank is destroyed\n• If the last enemy tank is lost through self-destruction or mutual destruction, the award goes to the player who destroyed the second-to-last enemy tank\n• Awarded regardless of victory\n• Only one award is granted per battle across both teams"
