"Maps/Description/lumber": "A quiet Alpine town was the ideal hideout for spies. But the secret is out, and tank battles are brewing in its narrow streets."
"Maps/Tactics/lumber": "The map is divided by a river. Heavies are better off using armor in the town, while maneuverable vehicles excel on the hilly riverbank. Bridges save time but are heavily targeted by tank destroyers. Crossing the riverbed takes longer but helps catch the enemy off guard."
"Maps/Description/karelia": "A harsh northern land where giant boulders serve as natural shields for armored vehicles. A headquarters is hidden deep within the stone maze."
"Maps/Tactics/karelia": "Heavy tanks benefit from holding the bunker area near the hangar gates, while more agile armor can play off the terrain and gun depression on the hilly plateau. Near the center, long-range fire from the map edges is particularly dangerous."
"Maps/Description/italy": "A picturesque town separated from abandoned outskirts by rolling green hills. Advance routes now cut straight through the vineyards."
"Maps/Tactics/italy": "Town roads let heavy tanks move faster while buildings cover their sides. However, all exits from the town are dangerously exposed to TD fire from the map center. In response, fast tanks can attempt an assault through the ruins: it is a convenient jumping-off point to push into the center across the river."
"Maps/Description/milbase": "A naval port in the shadow of an active volcano. The legendary battleship Yamato waits here, ready to awaken alongside the mountain."
"Maps/Tactics/milbase": "The ship and the hills are mutually line-of-sight high ground. Maneuvering on the ship is limited, so hull-down and side-scraping armor play work best. The hills provide cover and opportunities for surprise strikes, with spots behind them to fire on allied spots."
"Maps/Description/savanna": "In the heart of the desert, scorching sands surround a small settlement. Much like Eastern fables, massive dunes conceal sudden ambushes."
"Maps/Tactics/savanna": "Mediums with good gun depression can engage the town from dunes across the dry riverbed, though they risk becoming targets themselves. Lights can break through the rocks into the enemy rear. Heavies with strong turrets should occupy the dunes near the town—steep slopes will protect their sides."
"Maps/Description/rock": "The ruins of a majestic civilization endure in the sweltering tropics. Still-gushing fountains embody forgotten ancient technology."
"Maps/Tactics/rock": "The pyramids suit heavy tanks and side-scraping gameplay. Hills and the river offer open space for mobile vehicles. Capturing the central high ground can grant control over the entire location."
"Maps/Description/grossberg": "A thriving Eastern town where a bustling business district coexists harmoniously with a serene park."
"Maps/Tactics/grossberg": "Urban buildings favor positional cover-to-cover firefights and careful use of armor. The park area, by contrast, provides more opportunities for flanking maneuvers and controlling passages from the hills."
"Maps/Description/malinovka": "A small village on the shore of a deep lake. Winter has locked the water in ice, turning quiet homes into battlefield cover."
"Maps/Tactics/malinovka": "Battles on the hilly field favor dynamic play and quick decisions, whereas fighting at the windmill rewards heavy armor. Both directions remain open to crossfire."
"Maps/Description/mountain": "In hopes of good fortune, this valley was dubbed Golden, though no nuggets were found. Instead, the land proved fabulously rich in black gold."
"Maps/Tactics/mountain": "Mobile armor can flank through the cave or secure key hull-down positions. Capturing the industrial zone suits heavy armor and high-DPM play. When choosing a route, remember that open areas here are exposed to long-range fire."
"Maps/Description/canal": "Northern canal construction froze, leaving a plant and a village ringed by half-flooded trenches. Yet life persists: locals even raise bees here."
"Maps/Tactics/canal": "Hills near the railway favor snipers and tactical maneuvers. On the opposite bank, armor play takes priority. Moving along the canal offers a route change, though soft ground reduces speed."
"Maps/Description/canyon": "Melting snow exposes paths to mines and a sleepy town. A train with secret cargo was looted near the bridge, just like in Wild West days."
"Maps/Tactics/canyon": "Both flanks feature dense urban sectors for positional combat. Agile vehicles can attempt a flank along the riverbed. Tanks with solid gun depression should secure the central hill to go hull-down and support teammates."
"Maps/Description/karieri": "Dust hangs thick in the quarry, but the usual thunder of blasting and ore crushing has fallen silent. Now, different explosions ring out between melting shops and hangars."
"Maps/Tactics/karieri": "Descend into the basin only after ensuring at least one flank is clear, or you risk being caught in crossfire. If the heat gets too intense, seek cover inside the hangars."
"Maps/Description/pliego": "A monastery stands atop a high hill in the heart of Spanish lands. A river separates it from the city, giving the sanctuary the look of a fortress."
"Maps/Tactics/pliego": "The terrain near the windmill is well-suited for heavy tanks holding positions. Fast vehicles can strike through the city, but moving between buildings risks taking side shots. The monastery offers wide sightlines, though caution is required to avoid becoming a prime target."
"Maps/Description/lagoon": "An expedition to Southeast Asia. Atop the mountain lies an excavation of an ancient temple overlooking a village and a rocky shore."
"Maps/Tactics/lagoon": "The temple district suits heavy armor: flat terrain with abundant cover. On the coast, mobile vehicles with strong turrets or good gun depression hold the upper hand. The center is ideal for spotting enemies and controlling key transit lanes, including the beach zone."
"Maps/Description/glacier": "The power of giants lies hidden in a quiet town amidst permafrost. Wrecked ships on the rocks stand as silent witnesses."
"Maps/Tactics/glacier": "The central lighthouse offers commanding sightlines, but ascending it is exceptionally dangerous. On the built-up shore, mobile and long-range tanks hold the advantage. The ice around the ships favors heavily armored tanks with good gun depression, allowing strong terrain play."
"Maps/Description/erlenberg": "Combat preparations have replaced the peace of a European resort town. Even castle ruins must remember what storm and stress feel like."
"Maps/Tactics/erlenberg": "Heavily armored vehicles with high firepower dominate the town, though open alleys remain vulnerable to fire from the hill. The hill, in turn, gives mobile armor great opportunities for maneuvers, flanking routes, and controlling town choke points."
"Maps/Description/holland": "A picturesque town has found a dark muse. The idyll of old windmills and flower fields is shattered by the thunder of battle and a burning airship overhead."
"Maps/Tactics/holland": "Agile tanks benefit from taking the hilly village early to set up an ambush near the bunker. The town favors heavy armor. The town exit toward the center and the windmill sector unlock the full potential of vehicles with strong turrets and high gun depression."
"Maps/Description/skit": "Near the North Sea cliffs, ancient castle ruins adjoin massive concrete fortifications. Together, they form a unified, menacing coastal barrier."
"Maps/Tactics/skit": "Light and medium tanks benefit from seizing coastal fortifications first to claim long-range, albeit exposed, firing positions. Heavies are more comfortable playing positionally around ruins and rocks, though they must watch for rear flanks. Tank destroyers will find cover near the castle, though routes there can be hazardous."
"Maps/Description/neptune": "In northern France, a beachhead capture is underway. The largest landing in history unfolds under cannon flashes and the roar of aerial combat."
"Maps/Tactics/neptune": "Fighting hull-down at the windmill places you right in the thick of combat. It is easy to lie in wait near the plane, but you might miss an enemy flank. The coast offers a risky path to the enemy rear under overhead fire. The AA field is packed with safe cover, but keeps you far from the main clash."
"Maps/Description/forgecity": "Skyscrapers, old docks, Chinatown, and a giant donut. An ambitious metropolis holds thousands of stories, but right now it needs heroes."
"Maps/Tactics/forgecity": "A map of contrasts: city blocks with tight alleys favor armor play, while the long embankment under the bridge is ideal for fast flanking maneuvers. The elevated bridge serves as a key position for controlling central streets."
"Maps/Description/port": "A port with a lighthouse slumbers at the foot of the hills. Brick streets lead to an old town hall, a quiet reminder of how stealthily time passes here."
"Maps/Tactics/port": "Cliffs split the map in two. Lights can position across the river, while mediums and TDs can establish defensive or support positions on the hills, though shots into the city are limited. Heavies push best through the port, where sturdy structures sit alongside destructible cover."
"Maps/Description/plant": "The shift at a major factory was cut short. Battles rage among coal heaps and hangars. Trains sit frozen between the freight station and the collapsed bridge."
"Maps/Tactics/plant": "The factory gives cover to heavy tanks, and destroying gates on time helps gauge enemy numbers. Fast mediums can take the bridge to gain sightlines over most factory approaches. Tank destroyers excel at firing on allied spots near the river or wrecked train, as well as from the coal piles."
"Maps/Description/amigosville": "A cozy industrial settlement at the foot of snow-capped mountains. Every spring, meltwater flows from the peaks into the hollow."
"Maps/Tactics/amigosville": "Mediums can cross the hills near the factory to deliver flanking strikes. Heavies battle near the bridge, where hull-down and gun depression play pay off. Controlling the bridge grants TDs firing lines over almost the entire map. The center is dangerous, but with allied spots, it offers excellent target opportunities."
"Maps/Description/rudniki": "A Mediterranean town is consumed by combat. A hilltop mine overlooks streets, a military base, and a coastline with islets and a lighthouse."
"Maps/Tactics/rudniki": "Fast tanks with good gun depression benefit from securing the hill mine, though the summit is exposed to TD fire directly from spawns. To displace those TDs, mobile vehicles can flank via the lighthouse or the inlet. Heavies play comfortably behind cover in the town, safe from long-range snipers."
"Maps/Description/faust": "A secret military proving ground deep in the mountains. Hidden from outside eyes, experimental ballistic missiles are developed and tested here."
"Maps/Tactics/faust": "Mediums benefit from taking the bunker for quick access to central defensive platforms. With team support, these platforms serve as strong positions for TDs. Heavies fight best near the B-52 building, which provides a high vantage point to fire on the center."
"Maps/Description/fort": "An abandoned fort looms in the mountains. Its walls still stand ready to shelter fighters from shells, and surviving tapestries inspire valor."
"Maps/Tactics/fort": "This compact map is packed with cover and elevation changes. Multiple flank routes demand quick reactions. Mobile armor plays best closer to the field, while heavies should hold the ruins, using destroyed buildings as firing embrasures."
"Maps/Description/himmelsdorf": "A city aftermath of heavy combat. Routes to the central square are choked with ruined houses, wrecked train cars, and castle debris."
"Maps/Tactics/himmelsdorf": "Fast tanks can maneuver effectively near the railway or wait for an opening to push through the central square. Heavies and tanks with solid gun depression fight best along the fortress wall or utilizing embrasures in the central ruins."
"Maps/Description/rift": "Ruins of an ancient city by the azure sea, recalling the grandeur of Hellas. The amphitheater is setting the stage for a new, truly epic performance."
"Maps/Tactics/rift": "Heavies fight best in the temple ruins: low ground provides flank cover, while the upper tier offers hull-down positions. Mediums should aggressively spot the hills to flush out enemy TDs, though holding those positions alone is dangerous."
"Maps/Description/desert_train": "A town lost in the desert that became a vital supply hub. A railway line shields its market streets and homes from shifting sands."
"Maps/Tactics/desert_train": "Heavies engage easily in the town square or advance along narrow streets. Mobile tanks favor the dunes, where a aircraft fuselage aids hull-down play. TDs can set up along the tracks, but must watch for shots under train cars."
"Maps/Description/medvedkovo": "An assault on a secret base has begun in snow-capped mountains. A battle rages among rocky hills and icy fields to hold the railway station and its trains."
"Maps/Tactics/medvedkovo": "Mobile armor can evade fire and flank through the hills. Heavies fight more effectively in the open field using allied recon. The railway splits the map, closing distances for close-quarters combat if TDs cover the map edges."
"Maps/Description/idle": "A wild north settled after the rush of gold fever. Now, only the steady hum of the sawmill, a mountain stream, and flowers in melting snow remain."
"Maps/Tactics/idle": "Mediums with strong gun depression can take positions near the waterfall, but must beware of TDs watching the valley. Sturdy heavies fight best close-quarters in the center of the sawmill with flank support."
"Maps/Description/mars": "An avant-garde city of scientists rises among Martian wastes. Bold ideas belong in the Advanced High-Tech Park!"
"Maps/Tactics/mars": "The map is split between the desert and the domed base. Natural cover and elevation changes line the outskirts, while the dome glass obscures armor highlighting. Pushing inside the base risks encirclement, but offers a chance to strike the enemy rear."
"Maps/Description/cybermap": "Engine roars shake the stands. Steep ramps and an equipped arena stand ready to host vehicles for spectacular battles. This is the Stadium!"
"Maps/Tactics/cybermap": "Heavies and tough TDs play best inside the arena: cover is plentiful, though flanking routes exist. The center allows rapid rotation, but is exposed to elevated fire. The hills feature ramps that agile vehicles can jump off, while others use them as firing positions."
