"TankMechanics/GunCooling": "Gun Cooling"
"TankMechanics/GunCoolingDescription": "• If you wait a bit after the gun reloads, you can increase the damage of the next shot and speed up the reload after it.\n• The gun cooling process is shown on a special scale on both sides of the reticle.\n• To get the maximum bonus, you must wait for the gun to cool down completely."
"TankMechanics/TwinGuns": "Twin Guns"
"TankMechanics/TwinGunsDescription": "• The guns have two firing modes (Single and Doublet) which are switched by pressing a button.\n• In Single mode, the guns fire alternately and their reload happens independently of each other.\n• For a Doublet shot, reloading must be completed for both guns.\n• Reticle markers are tied to each gun, changing their position depending on the distance."
