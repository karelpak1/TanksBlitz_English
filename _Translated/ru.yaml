"tankTree/EarlyAccess/Header": "Expedition to Mars"
"tankTree/EarlyAccess/Popup/EarlyAccessHeader": "Expedition to Mars"
"tankTree/EarlyAccess/Popup/EarlyAccessInfo": "Explore the secrets of the Red Planet, collect Blueprints and become a pioneer of a new line of tanks with unique mechanics!<br/><br/>The Tier V tank is available to everyone at the start of the expedition. Combat XP will be required to upgrade modules, and Blueprints will be required to research Tier VI tanks and above. Get them in a special draw, and from the second week of the expedition, also from containers for completing personal missions.<br/><br/>Researched tanks can be purchased for credits."
"tankTree/EarlyAccess/Popup/CommonAccessHeader": "Discovery"
"tankTree/EarlyAccess/Popup/CommonAccessInfo": "Every expedition into the unknown always ends with important discoveries. And ours is no exception!<br/><br/>After the Expedition to Mars is complete, all tanks from the new branch can be researched with Combat XP and purchased for credits.<br/><br/>All unused Blueprints remain in Storage."
