"2025-RS/currency/terms": "Earn Shields for every Ranked Battle in Tier VII–X tanks:\n\n   • Bronze League — 10 Shields per battle and 1 per win;\n   • Silver League — 11 Shields per battle and 2 per win;\n   • Gold League — 13 Shields per battle and 3 per win;\n   • Platinum League — 16 Shields per battle and 6 per win;\n   • Diamond League — 20 Shields per battle and 10 per win.\n\nShields are awarded only for battles in which you earn at least 300 Combat XP."
