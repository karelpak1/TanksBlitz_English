"TankMechanics/GunSwitcherDescription": "• The tank has two firing modes, which are switched by pressing the button.\n• In the first, the tank fires shells one at a time with a delay of 1 second, and in the second, it fires in a salvo.\n• If shells remain in the magazine when switching between the first and second modes, you can either fire all remaining shells or fully reload the gun."
