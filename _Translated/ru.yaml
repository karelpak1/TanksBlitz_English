"2026-RS/currency/terms": "Receive Flash Drives for each rating battle in Tier VII–X tanks:\n\n • Bronze League — 10 Flash Drives per battle and 1 for victory;\n • Silver League — 11 Flash Drives per battle and 2 for victory;\n • Gold League — 13 Flash Drives per battle and 3 for victory;\n • Platinum League — 16 Flash Drives per battle and 6 for victory;\n • Diamond League — 20 Flash Drives per battle and 10 for victory.\n\nFlash Drives are awarded only for battles where you earn at least 200 base combat XP."
"2026-SRR12/header": "Gold Fund"
"2026-SRR12/ProgressStage/Hint": "Get  Chip Cards for Mastery Badges and by exchanging resources.\nVictories in Tier IV–X tanks will bring Badges"
"2026-SRR12/currency/win/terms": "• Play Tier IV–X tanks in regular and rating battles and get 1 Badge per victory\n• Badges are awarded only for winning battles where you earn enough base combat XP without modifiers:%(drop)"
"2026-SRR12/currency/buy/terms": "• Exchange resources for Chip Cards\n• Get Chip Cards for Mastery Badges:\n\n• Ace — 200\n• 1st Class — 100\n• 2nd Class — 50\n• 3rd Class — 25"
