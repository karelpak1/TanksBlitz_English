"2026-TRIALS-DC/currency/terms": "Select tasks, activate attempts, complete them successfully in Tier IV−X tanks in regular and rating battles and get Unidentified Objects:\n• 1 Unidentified Object — for every 100 units of damage dealt\n• 3 Unidentified Objects — for every 100 units of base combat XP\n• 15 Unidentified Objects — for every enemy tank destroyed\n• 35 Unidentified Objects — for every victory\n• 45 Unidentified Objects — for every Mastery Badge Class 3 and higher"
