"#achievements:medalAlphaAndOmega_condition": "• Survive at the moment the enemy tanks are destroyed\n• Only one award is granted per battle across both teams\n• Requirements for both \"First Thunder\" and \"Cobra Strike\" must be fulfilled in a single battle\n• If \"Dragon's Cunning\" is earned, separate \"First Thunder\" and \"Cobra Strike\" awards are not granted"
