"storage/Items/s37_ambassador_chest_s/Title": "Ambassador Premium Container"
"storage/Items/s37_ambassador_chest_s/Description": "1 of 2 reward groups is granted. The reward group is selected based on the following drop chances.\nReward with a 5% drop chance: the Ambassador, a Tier IX medium tank.\nRewards with a 95% drop chance:\n• 3–7 Common Certificates for Free XP\n• 100,000–275,000 Credits\n• 1 Ambassador Charm\n• Either 15–100 Gold Boosters or 250–1,000 Gold\n• 1 or 2 types of Epic Boosters: up to 10 Credit Boosters, up to 20 Combat XP Boosters, up to 40 Crew XP Boosters, and/or up to 40 Free XP Boosters"
