"storage/Items/F131_Brennos_comrades_chest/Description": "1 of 2 reward groups is granted. The reward group is selected based on the following drop chances.\nIncludes 1 of these Tier VIII tanks with a 5% drop chance:\n• Brennos, a Collector heavy tank\n• Object Kust, a Collector tank destroyer\n• ELC AMX-901, a Collector light tank\n• Titan JPanther II, a Collector tank destroyer\nIncludes these rewards with a 95% drop chance:\n• 1 Brennos and Comrades Charm\n• 70,000–190,000 Credits\n• 1–3 Common Certificates for Free XP\n• Common, Rare, and Epic Boosters (Credit, Combat XP, Crew XP, Free XP, and Gold)\n• 1–3 Certificates for x3 XP Bonus\nYou won't receive the same tank again from the Brennos and Comrades Container until all tanks have been ruled-out."
