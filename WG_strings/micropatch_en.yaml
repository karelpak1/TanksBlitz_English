"storage/Items/profile_skin_2026_april_red/Description": "The best is blessed.\nChanges your profile background."
"storage/Items/avatar_2026_april_red/Title": "Max Holloway Avatar"
"storage/Items/avatar_2026_april_red/Description": "Channel your agility."
"storage/Items/collectable_item_2026_april_red/Title": "Hibiscus Patch Collectible Item"
"storage/Items/collectable_item_2026_april_red/Description": "Every swift action requires \"pono\"—balance and integrity. Max \"Blessed\" Holloway’s Hawaiian roots helped build his diverse fighting style, incorporating kickboxing and quick strikes to keep opponents guessing."
"storage/Items/collectable_item_2026_april_red/Features": "Keep it as a souvenir or exchange it for 2,300 Free XP."
"storage/Items/collectable_item_2026_april_red/Obtainment": "Reward in the Claim the Spirit Event."
"storage/Items/profile_skin_2026_april_yellow/Title": "Israel Adesanya Profile Background"
"storage/Items/profile_skin_2026_april_yellow/Description": "Don't throw and hope, aim and fire.\nChanges your profile background."
"2026-APRIL/PreviewStage/Violet/Description": "Lead with discipline. Land each strike. CHAMA!"
