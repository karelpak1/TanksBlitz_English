"storage/Items/avatar_2026_april_yellow/Description": "Channel your control."
"storage/Items/collectable_item_2026_april_yellow/Title": "Men-Yoroi Collectible Item"
"storage/Items/collectable_item_2026_april_yellow/Description": "The control of a samurai, the inner courage to face the next fight. Israel \"The Last Stylebender\" Adesanya is a Nigerian-New Zealand fighter whose love of Japanese culture, manga, and games fuels his vigilant tactics in the Octagon."
"storage/Items/collectable_item_2026_april_yellow/Features": "Keep it as a souvenir or exchange it for 2,300 Free XP."
"storage/Items/collectable_item_2026_april_yellow/Obtainment": "Reward in the Claim the Spirit Event."
"storage/Items/profile_skin_2026_april_violet/Title": "Alex Pereira Profile Background"
"storage/Items/profile_skin_2026_april_violet/Description": "Chama!\nChanges your profile background."
"storage/Items/avatar_2026_april_violet/Title": "Alex Pereira Avatar"
"storage/Items/avatar_2026_april_violet/Description": "Channel your power."
"storage/Items/collectable_item_2026_april_violet/Title": "Cocar Collectible Item"
"storage/Items/collectable_item_2026_april_violet/Description": "The Pataxó headdress rises boldly as a symbol of honor. Alex \"Poatan\" Pereira is a Brazilian fighter who proudly represents his indigenous heritage with each decisive move, including his monumental left hook."
