"storage/Items/avatar_2025_topup_gw_anim/Title": "AMX M4 54 Girl Avatar"
"2025-MU/header": "Play Reforged Update! Get Rewards!"
"#account:Blocks/Wargaming/Title": "Update your account and get a reward 2,000 gold!"
"#account:Completion/Congrats/Text": "You have received bonus 1,750 gold +"
"storage/Items/chest_2026_flea_1/Description": "Includes these rewards:\n• 3–100 Metal Buttons\n• 1 Crowbar Charm\n• 500–100,000 Gold\nAND\nMay also include these rewards:\n• 1 Crowbar with a 3% drop chance\n• Iron Heartbeat Animated Avatar with a 0.1% drop chance\n• Convoyer, a Tier VIII Collector heavy tank, with a 0.1% drop chance\n• 1 tank from among the other tanks in the list with a 3% drop chance\n• 1 Legendary camouflage from the list with a 4% drop chance\n• 1–20 Certificates for XP Bonus with a 25% drop chance\n• 750–100,000 Free XP with a 25% drop chance\n• 1–3 of one type of the Containers from the list with a 50% drop chance"
"storage/Items/chest_2026_flea_2/Description": "Includes these rewards:\n• 5–200 Metal Buttons\n• 1 Fixed Up Garage Charm\n• 1–3 of one type of the Containers from the list\n• 500–100,000 Gold\n• 1,000–100,000 Free XP\nAND\nMay also include these rewards:\n• 1 tank from the list with a 6% drop chance\n• Iron Heartbeat Animated Avatar with a 1% drop chance\n• Convoyer Profile Background with a 0.1% drop chance\n• 1 Legendary camouflage from the list with an 8% drop chance\n• 1–20 Certificates for XP Bonus with a 50% drop chance\nYou won't receive the same tank again from the Fixed Up Garage until all tanks have been ruled-out."
"2026-PR/header": "Active Core"
"avatars/Items/bp71/FreeBattlePass/Title": "Forest Foragers Avatar"
"avatars/Items/bp71/PaidBattlePass/Title": "Campfire Boogie Avatar"
"avatars/Items/bp71/avatar_progressive_bp_71_free/Description": "Out in the forest, every mission matters—big or small."
"avatars/Items/bp71/avatar_progressive_bp_71_paid/Description": "All it takes to cozy up a campsite is a little spark."
"storage/Items/profile_skin_2026_topup_may_anim/Description": "S. Conqueror Silver Vanguard vs AMX M4 mle. 54—let's settle the debate of which is the most noble.\nChanges your profile background."
"storage/Items/profile_skin_2026_topup_may_anim/Title": "Age-Old Rivalry Animated Profile Background"
"storage/Items/prx_chest_2026_flea_charm_2/Title": "Fixed Up Garage Charm"
"storage/Items/prx_chest_2026_flea_charm_2/Description": "Collecting enough currency triggers a guaranteed drop of one of these rewards: the Convoyer, Rammer, Kampfpanzer 50 t, Chieftain Mk. 6, T-22 medium, Object 752, 114 SP2, 116-F3, XM66F, Char Futur 4, M60, BZ-58-2, Erich Konzept I, or T-2020."
"storage/Items/prx_chest_2026_flea_charm_2/Obtainment": "Open Fixed Up Garages."
"storage/Items/chest_2026_flea_custom/Description": "Includes 1 type of Boosters (Combat XP, Crew XP, Credit, Cooldown). May also include these rewards:\n• 1 customization item from the list with a 5% drop chance\n• 1 Can-Opener with a 0.5% drop chance"
"storage/Items/chest_2026_flea_for_gold/Description": "Includes 5,000–100,000 Free XP. May also include these rewards:\n• Rammer, a Tier VII Collector heavy tank, with a 1% drop chance\n• 1 Can-Opener with a 3% drop chance\n• 1–10 Metal Buttons with a 10% drop chance"
