"storage/Items/trick_or_treat_chest/Description": "While wandering a dark path, you find a lantern singing a spooky song. Will you open it? Among the rewards, you may find a Halloween tank with a 7% drop chance!\n1 of 2 reward groups is granted. The reward group is selected based on the following drop chances.\nTreaty rewards with a 20% drop chance:\n• 7–15 Common Free XP Certificates\n• 150,000–375,000 Credits\n• 500–10,000 Gold\n• Along with the resources, 1 tank from the list with a 7% drop chance\n• Along with the resources, 1 Legendary Camouflage from the list with a 7% drop chance\n• Along with the resources, 1 Attachment with a 5% drop chance (Witch's Fellow or Hunter's Moon Folio)\n• Along with the resources, Spooky Reactions Pack from the list with a 3% drop chance\nTricky rewards with an 80% drop chance:\n• 7–15 Common Free XP Certificates\n• 150,000–375,000 Credits\n• Epic Boosters (Credit, Combat XP, Free XP, or Crew XP)\n• Along with the resources, 1 Avatar or Animated Avatar from the list with a 8% drop chance\n• Along with the resources, 1 Camouflage from the list with a 8% drop chance\n• Along with the resources, 1 Profile Background from the list with a 4% drop chance\n• Along with the resources, 1 Attachment with a 3.2% drop chance (Spear 'n Sear, Tank-o'-lantern, Wings of Night, or Soul Conductor)\n• Along with the resources, Spooky Reactions Pack from the list with a 1.6% drop chance"
