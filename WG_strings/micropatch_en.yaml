"storage/Items/F131_Brennos_chest/Description": "1 of 2 reward groups is granted. The reward group is selected based on the following drop chances.\nReward with a 5% drop chance: the Brennos, a Tier VIII Collector heavy tank.\nRewards with a 95% drop chance:\n• 1 Brennos Charm\n• 25,000–130,000 Credits\n• Either 100–1,000 Gold or 1–4 Common Free XP Certificates\n• Common, Rare, and Epic Boosters (Credit, Combat XP, Crew XP, Free XP, and Gold)\n• 1–3 Certificates for x3, x4, or x5 XP bonus"
