"2026-JULY/ProgressStage/Hint": "驾驶IV-X级坦克达成2级或以上战斗嘉奖勋章可得<proxy1/>！打开安东塔斯集装箱有几率获得更多<proxy1/>！\n打开未央城集装箱必得<proxy2/>，可在商店兑换稀有坦克，更有几率获得额外的<proxy1/>和IX级联动坦克“星际猎人”！"
"2026-JULY/currency/win/terms": "驾驶IV-X级坦克在每场战斗中达成达成2级或以上战斗嘉奖勋章即可获得2个星门勋章。"
