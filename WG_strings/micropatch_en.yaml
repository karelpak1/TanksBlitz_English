"storage/Items/chest_2026_progress_special/Description": "Includes these rewards:\n• 8 Joint Efforts\n• 2 Tanker's Rings\nAlso includes 1 of these rewards. You won't receive the same reward again from the Ignition Sequence Container until all these rewards have been ruled-out:\n• 500 Gold\n• 5 Certificates for XP\n• 1 Reactions Pack\n• 1 Profile Background\n• 1 Garage Gear\nClaim an Ignition Sequence Container on each key date and contribute more to the Joint Progress."
