"#vehicle_customization:camouflage/skin2_f17_amx_13_90/Descr": "For the %(vehicleName). Changes the name in battle to %(customVehicleName). %(highlight_start)+%(number)%%(highlight_end) to concealment. Install it for Summer, Winter, and Desert maps.\nWith this Legendary camouflage installed, these attachments cannot be applied: D-2 Model 1926 AA Mount, Wings of Night, Noboribata, What's-in-the-Box?, Emoji Light, Festive Gatling, Spear 'n Sear, Blitz MP Corps, Soul Conductor, Wasted Shot, Tank-o'-lantern, MG 08, Pot of Plenty, Witch's Fellow, Rating Indicator, Snowgun, Tanky the Snowman, Teslagun."
