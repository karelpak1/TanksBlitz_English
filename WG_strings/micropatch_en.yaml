"2026-GW-TOP-UP/currency/win/terms": "• 驾驶Ⅳ-X 级坦克每取得一场胜利，可获得2个战备燃油。驾驶带有经验加成的C系坦克获胜可额外获得1个战备燃油！\n• 要想通过战斗胜利获得战备燃油，您必须在单场战斗中获得足够的战斗经验（不计算额外收益 ）：<br/><br/>%(drop)"
