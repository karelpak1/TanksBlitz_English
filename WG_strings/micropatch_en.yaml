"hangar/battleType/gravitizingDescription": "Check out what happens when Uprising meets Gravity Force:\n\nUprising characteristics:\n• Number of lives: your tank respawns twice per battle.\n• During the battle, you gradually accumulate Elixir.\n• Abilities: 7 initial abilities and 11 abilities that can be bought in a battle for Elixir.\n\nGravity Force characteristics:\n• Reduced gravity.\n• Controlling your tank in flight.\n• Reduced damage from falling and accelerated movement of tanks.\n\nBattles are fought in Tier V–X tanks in Encounter, they last 9 minutes and aren’t included in your stats."
