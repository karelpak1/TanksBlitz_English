"storage/Items/G168_KJpz_T_III_chest/Description": "Includes the KJPZ TIII Jäger, a Collector Tier IX tank destroyer, with a 5% drop chance.\nOR\nIncludes these resources with a 95% drop chance:\n• 1 KJPZ Jäger Charm\n• 3 different rarity types of Boosters from among Combat XP, Free XP, Crew XP, Credit, and Cooldown Boosters\n• 40,000–115,000 Credits\nAlong with the resources, may also include 200–1,150 Gold with a 19% drop chance or 16–73 Gold Boosters with a 76% drop chance."
"storage/Items/prx_progress_chest_G168_KJpz_T_III/Title": "KJPZ Jäger Charm"
"storage/Items/prx_progress_chest_G168_KJpz_T_III/Description": "Currency to obtain the KJPZ TIII Jäger, a Collector Tier IX tank destroyer. Collecting enough currency triggers guaranteed drop of the tank destroyer from the KJPZ Jäger Container."
"storage/Items/G168_KJpz_T_III_comrades_chest/Title": "KJPZ Jäger and Comrades Container"
"storage/Items/G168_KJpz_T_III_comrades_chest/Description": "Includes one of these Tier IX tanks with a 5% drop chance:\n• KJPZ TIII Jäger, a Collector tank destroyer\n• AC-09V Sterope, a Collector heavy tank\n• FVE Defender, a Collector medium tank\n• ATAC, a Collector light tank\nOR\nIncludes these resources with a 95% drop chance:\n• 1 KJPZ Jäger and Comrades Charm\n• 3 different rarity types of Boosters from among Combat XP, Free XP, Crew XP, Credit, Cooldown, and Gold Boosters\n• 2–4 Certificates for XP Bonus\n• 2–4 Common Certificates for Free XP\n• 100,000–260,000 Credits\nYou won't receive the same tank again from the KJPZ Jäger and Comrades Container until all tanks have been ruled-out."
"storage/Items/prx_progress_chest_KJpz_T_III_comrades/Title": "KJPZ Jäger and Comrades Charm"
"storage/Items/prx_progress_chest_KJpz_T_III_comrades/Description": "Collecting enough currency triggers a guaranteed drop of one of these rewards: the KJPZ TIII Jäger, AC-09V Sterope, FVE Defender, or the ATAC."
