"hangar/battleType/pure_equalizerDescription": "You can join this Battle Mode using any tanks of any Tier. All the tanks are rebalanced based on the average characteristics of Tier X tanks of each tank type. The matchmaker balances the tank types involved in each team as usual.\nBattles take place in Supremacy or Encounter, and last 7 minutes. The objective of each battle type remains the same as in Regular Battles. Battles don't affect your stats."
