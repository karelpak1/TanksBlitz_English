"storage/Items/chest_2026_after_party_1/Description": "1 of 2 reward groups is granted. The reward group is selected based on the following drop chances.\nRewards with a 3% drop chance:\n• 1 random Defender or Titan tank from the list\n• 1 Key Card Charm\nRewards with a 97% drop chance:\n• 3–50 Copper Coils\n• 200–2,000 Gold\n• Common, Rare, or Epic Certificate for Free XP\n• Rare Credit, Combat XP, Free XP, or Cooldown Boosters\n• 1 Key Card Charm\n• Along with these resources, may also include 1 Camouflage with a 9.7% drop chance\nAlong with either of the reward groups above, may also include 1 Key Card with a 2% drop chance."
"storage/Items/chest_2026_after_party_1/Title": "Cargo Stash"
"storage/Items/chest_2026_after_party_2/Description": "1 of 2 reward groups is granted. The reward group is selected based on the following drop chances.\nRewards with a 15% drop chance: Titan Charioteer, FVE Defender, or LEY-1 Defender.\nRewards with a 85% drop chance:\n• 6–80 Adjustable Wrenches\n• 450–3,000 Gold\n• Common, Rare, or Epic Certificate for Free XP\n• Rare Credit, Combat XP, Free XP, or Cooldown Boosters\n• 1 Supply Bay Charm\n• Along with these resources, may also include 1 Camouflage with a 8.5% drop chance\nYou won't receive the same tank again from the Supply Bay until all tanks have been ruled-out."
