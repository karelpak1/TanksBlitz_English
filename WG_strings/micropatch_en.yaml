"hangar/battleType/totalGameModeShortDescription": "Tier I–X tanks meet on one field. Take control of the rapidly changing bases with your team strategy and maneuver!"
"hangar/battleType/total_game_modeDescription": "To win, be the first to earn 1,000 victory points or obtain more victory points than the enemy team before time’s up. Respawn is infinite.\nYou can join this Battle Mode using any tanks of any Tier. All the tanks are rebalanced based on the average characteristics of Tier X tanks of each tank type. The matchmaker balances the tank types involved in each team as usual.\nBattles last 7 minutes, and don't affect your stats.\n\nCapture Random Bases:\n• Capture and defend active bases on the map to earn victory points. Quick action is required to capture each Base.\n• If both ally and enemy tanks are present inside the captured Base's circle, the Base's owner will only earn 30% of the victory points.\n• The active Bases appear on the map one after another randomly.\n• Before the next Base activates, a lock icon will appear indicating its position on the minimap first. You can start capturing the Base after the lock icon disappears.\n• When a new Base activates, it’s chosen among the Bases that haven’t activated yet. If all Bases on the map have already activated once, a new Base rotation starts.\n• Keep your eyes on the minimap to respond swiftly to changes. Remember the first active Base appears in the center of the map.\n\nRepel Enemies:\n• Prevent the enemy team from capturing active Bases by damaging their tanks inside the Base circle.\n• Recapture the active bases that were previously captured by the enemy team.\n• Destroy enemy tanks to reduce the enemy team's victory points. They lose 25 victory points each time you destroy one of their tanks.\n\nAdditional Features:\n• If your team's victory points are significantly lower than the enemy team's victory points, your team's tanks will respawn faster than before."
